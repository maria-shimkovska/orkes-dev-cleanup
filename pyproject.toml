[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orkes-dev-cleanup"
version = "0.1.0"
description = "Reset your Orkes developer edition environment from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "conductor-python>=0.0.1",
    "requests>=2.28",
]

[project.scripts]
orkes-cleanup = "orkes_dev_cleanup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
